                      type: object
                      properties:
                        id: { type: string }
                        orgId: { type: string }
                        clientId: { type: string }
                        redirectUris:
                          type: array
                          items: { type: string }
                        status: { type: string }
                        lastUsedAt: { type: [string, "null"], format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/connectors/oauth/clients/{clientRecordId}/revoke:
    post:
      tags: [Admin]
      operationId: revokeAdminOauthClient
      summary: Revoke an MCP OAuth client
      parameters:
        - { name: clientRecordId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Revoked client.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/connectors/oauth/refresh-tokens:
    get:
      tags: [Admin]
      operationId: listAdminOauthRefreshTokens
      summary: List MCP OAuth refresh tokens
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, revoked] } }
        - { name: clientId, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Refresh tokens (no secrets).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        orgId: { type: string }
                        clientId: { type: string }
                        status: { type: string }
                        principalKind: { type: string }
                        principalId: { type: string }
                        oauthScopes: { type: string }
                        expiresAt: { type: string, format: date-time }
                        lastUsedAt: { type: [string, "null"], format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/connectors/oauth/refresh-tokens/{refreshTokenId}/revoke:
    post:
      tags: [Admin]
      operationId: revokeAdminOauthRefreshToken
      summary: Revoke an MCP OAuth refresh token
      parameters:
        - { name: refreshTokenId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Revoked token.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAdminAuditEvents
      summary: Query the audit log
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Free-text search. }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Audit events, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  query: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhooks
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Webhooks and the supported event types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTypes:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEventType" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create a webhook
      description: |
        The signing secret is returned once in `secret` and stored encrypted (requires
        `COCO_SETTINGS_ENCRYPTION_KEY`, else 503). Endpoint URLs must be https and must not
        point at private/loopback hosts unless the deployment opts out
        (`COCO_WEBHOOKS_ALLOW_HTTP=1`, `COCO_WEBHOOKS_ALLOW_PRIVATE_URLS=1`).
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, maxLength: 2000 }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEventType" }
                spaceSlug:
                  type: [string, "null"]
                  description: Restrict deliveries to one space; null/omitted means org-wide.
                description: { type: string, maxLength: 280 }
      responses:
        "201":
          description: Webhook created; includes the one-time signing secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/webhooks/{webhookId}:
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update a webhook
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEventType" }
                spaceSlug: { type: [string, "null"] }
                description: { type: string, maxLength: 280 }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: Updated webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/webhooks/{webhookId}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate a webhook's signing secret
      description: The new secret is returned once and never again.
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Webhook with the new one-time secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  secret: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/webhooks/{webhookId}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a test delivery
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Delivery outcome for a synthetic `webhook.test` event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean }
                  status: { type: string }
                  attempts: { type: integer }
                  responseStatus: { type: [integer, "null"] }
                  error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/webhooks/{webhookId}/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List a webhook's delivery log
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Recent deliveries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        eventType: { type: string }
                        status: { type: string }
                        attempts: { type: integer }
                        responseStatus: { type: [integer, "null"] }
                        error: { type: [string, "null"] }
                        createdAt: { type: string, format: date-time }
                        completedAt: { type: [string, "null"], format: date-time }
                        payload: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/agent-usage:
    get:
      tags: [Admin]
      operationId: getAdminAgentUsage
      summary: Agent token usage summary
      parameters:
        - { name: sinceDays, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 7 } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Usage totals for the window.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/Unavailable" }

  /admin/policies/summary:
    get:
      tags: [Admin]
      operationId: getAdminPoliciesSummary
      summary: Policy model summary
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Policy model version, precedence, role-action matrix, and coverage.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/policies/spaces/{spaceId}/effective-access:
    get:
      tags: [Admin]
      operationId: getAdminSpaceEffectiveAccess
      summary: Effective access for a space
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Humans and agents with their effective roles and sources.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/policies/decisions/preview:
    post:
      tags: [Admin]
      operationId: previewAdminPolicyDecision
      summary: Preview an ACL decision
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, action, resource]
              properties:
                principal:
                  type: object
                  required: [kind, id]
                  properties:
                    kind: { type: string, enum: [human, agent] }
                    id: { type: string }
                    scopes:
                      type: array
                      items: { type: string }
                      default: [read]
                action: { type: string, enum: [read, list, search, write, admin] }
                resource:
                  type: object
                  required: [orgId]
                  properties:
                    orgId: { type: string }
                    spaceId: { type: [string, "null"] }
                    pageId: { type: [string, "null"] }
                    resourcePath: { type: string }
      responses:
        "200":
          description: The decision with explainability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: { type: string, enum: [allow, deny] }
                  reasonCode: { type: string }
                  policyModelVersion: { type: string }
                  explainability: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ------------------------------------------------------------------
  # SCIM
  # ------------------------------------------------------------------
  /scim/v1/users:
    post:
      tags: [SCIM]
      operationId: scimCreateUser
      summary: Provision a user
      description: Idempotent upsert keyed by provider + externalId. Group memberships are applied through the org's identity mappings.
      security:
        - scimToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimUserRequest" }
      responses:
        "200":
          description: Provisioning result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimUserResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /scim/v1/users/{externalId}:
    patch:
      tags: [SCIM]
      operationId: scimUpdateUser
      summary: Update a provisioned user
      security:
        - scimToken: []
      parameters:
        - { name: externalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                displayName: { type: string, description: Defaults to the email. }
                active: { type: boolean, default: true }
                groups:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Provisioning result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimUserResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ------------------------------------------------------------------
  # Billing (multi-tenant deployments only)
  # ------------------------------------------------------------------
  /billing/plans:
    get:
      tags: [Billing]
      operationId: getBillingPlans
      summary: Public plan catalog
      security: []
      responses:
        "200":
          description: Plans, credit-block pricing, and per-model credit rates. No Stripe identifiers are exposed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        tagline: { type: string }
                        priceMonthlyUsd: { type: number }
                        priceYearlyUsd: { type: number }
                        includedMonthlyCredits: { type: integer }
                        limits: { type: object, additionalProperties: true }
                        highlights:
                          type: array
                          items: { type: string }
                  creditBlock:
                    type: object
                    properties:
                      credits: { type: integer }
                      priceUsd: { type: number }
                  creditRates: { type: object, additionalProperties: true }

  /billing/account:
    get:
      tags: [Billing]
      operationId: getBillingAccount
      summary: Billing account summary (admin)
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Plan, credits, renewal, and auto-topup state.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      summary: Start a subscription checkout
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                interval: { type: string, enum: [monthly, yearly], default: monthly }
      responses:
        "200":
          description: Stripe Checkout URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /billing/topup/checkout:
    post:
      tags: [Billing]
      operationId: createBillingTopupCheckout
      summary: Buy credit blocks
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blocks: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Stripe Checkout URL and credits to be granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  credits: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /billing/cancel:
    post:
      tags: [Billing]
      operationId: cancelBillingSubscription
      summary: Cancel at period end
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Cancellation scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cancelAtPeriodEnd: { type: boolean }
                  currentPeriodEnd: { type: [string, "null"], format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /billing/resume:
    post:
      tags: [Billing]
      operationId: resumeBillingSubscription
      summary: Resume a cancelling subscription
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Cancellation reverted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cancelAtPeriodEnd: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /billing/portal:
    post:
      tags: [Billing]
      operationId: createBillingPortalSession
      summary: Open the Stripe billing portal
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Portal URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /billing/auto-topup:
    put:
      tags: [Billing]
      operationId: putBillingAutoTopup
      summary: Configure auto top-up
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                thresholdCredits: { type: integer, minimum: 0 }
                blocks: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated auto-topup settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  autoTopup: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /billing/webhook:
    post:
      tags: [Billing]
      operationId: billingWebhook
      summary: Stripe webhook
      description: Authenticated by the `Stripe-Signature` header (timing-safe verification), not a session. Events are recorded for replay-safe audit.
      security: []
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Event processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      bearerFormat: agent key
      description: Agent API key (`coco_...`) minted at `POST /admin/agent-keys`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: coco_session
      description: OIDC session cookie set by the `/auth` flow.
    mcpOAuth:
      type: oauth2
      description: OAuth 2.0 for MCP clients (PKCE required, dynamic client registration supported).
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            context:read: Read pages, spaces, search, and metadata.
            context:write: Create and update pages, spaces, and metadata.
    scimToken:
      type: http
      scheme: bearer
      bearerFormat: SCIM token
      description: SCIM provisioning token, rotated at `POST /admin/identity/scim/tokens/rotate`.

  headers:
    ETag:
      description: Weak entity tag carrying the page version, e.g. `W/"3"`.
      schema: { type: string }

  parameters:
    OrgSlugHeader:
      name: X-Coco-Org-Slug
      in: header
      required: false
      schema: { type: string }
      description: Org slug for multi-tenant deployments. Alternatives — `X-Coco-Org-Id`, or the session's org claim. Not needed on single-tenant deployments.
    SpaceSlug:
      name: spaceSlug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      description: The space's route slug.
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string }
      description: The space's admin identifier.
    PagePath:
      name: pagePath
      in: path
      required: true
      schema: { type: string }
      description: The page path within the space. May contain `/` separators (e.g. `team/standards`). Append `.md` to force a Markdown response on reads.
    VersionQuery:
      name: version
      in: query
      required: false
      schema:
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string, enum: [latest, current, newest, head, first, oldest, initial] }
      description: Version to read — a positive integer or a keyword alias. Defaults to the latest revision.
    VersionSpecifier:
      name: version
      in: path
      required: true
      schema:
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string, enum: [latest, current, newest, head, first, oldest, initial] }
      description: Source version — a positive integer or a keyword alias.
    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: Expected current version when updating an existing page. Accepted forms — `3`, `"3"`, `W/"3"`. Required on updates (428 when missing, 412 when stale); omit when creating.
    TaskPath:
      name: task
      in: path
      required: true
      schema: { type: string }
      description: The task's path under `agents/`. May contain `/` separators (e.g. `reports/weekly`). `instructions` and `runs/...` are reserved.
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
      description: Run record id, from a run listing or the async trigger's 202 response.
    SpaceTemplateSource:
      name: source
      in: path
      required: true
      schema: { type: string, enum: [builtin, remote, org] }
      description: Which catalog the template comes from — the built-in/local catalog, the opt-in remote catalog, or this org's saved snapshots.
    SpaceTemplateId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 64 }
      description: The template's kebab-case id.

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No principal could be resolved from the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The principal is not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ForbiddenError" }
    NotFound:
      description: The resource does not exist (or is not visible).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with current state (duplicate, guarded mutation, or lockout risk).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlanLimit:
      description: A plan cap (seats, spaces, or content documents) was reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlanLimitError" }
    Unavailable:
      description: The feature is not available on this deployment (missing database, OIDC, Stripe, or encryption configuration).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: An upstream provider (Stripe or a connector vendor) returned an error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Ok:
      type: object
      properties:
        ok: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
        reasonCode: { type: string }

    ForbiddenError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        reasonCode:
          type: string
          enum:
            - not_authenticated
            - membership_pending_approval
            - insufficient_role
            - space_membership_required
            - page_rule_denied
            - canonical_principal_required
        nextSteps:
          type: array
          items: { type: string }

    PlanLimitError:
      type: object
      required: [error, reasonCode]
      properties:
        error: { type: string }
        reasonCode: { type: string, const: plan_limit_reached }
        cap:
          type: object
          properties:
            kind: { type: string }
            current: { type: integer }
            limit: { type: integer }
            planId: { type: string }

    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }

    Principal:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [human, agent] }
        scopes:
          type: array
          items: { type: string }

    Actor:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [human, agent] }

    PageWriteRequest:
      type: object
      properties:
        title: { type: string }
        frontmatter:
          type: object
          additionalProperties: true
        content:
          type: string
          description: >-
            Markdown page body, stored verbatim on this REST surface. Required unless a
            `template` supplies it on create. Pass title/frontmatter as the separate fields —
            only the MCP door's `context_*` tools fold a leading `---` block of flat
            `key: value` lines back into them; REST does not.
        template:
          type: string
          description: Create-only. Template to base the page on — a name resolved in the target space (`event`) or a full `<space>/templates/<name>` path. Applies the template's defaults, validates `metadata` against its schema, and stamps the page's `template` metadata key.
        metadata:
          type: object
          additionalProperties: true
          description: Create-only. Initial metadata values, validated against the template's metadata schema when `template` is given.
        note:
          type: string
          maxLength: 500
          description: Optional change note recorded on the revision and shown in version history.

    PageWriteResult:
      type: object
      properties:
        path: { type: string }
        version: { type: integer }
        metadata:
          type: object
          additionalProperties: true
          description: The applied metadata record (create-from-template / initial metadata only).

    PageListItem:
      type: object
      properties:
        path: { type: string }
        title: { type: string }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    TemplateMetadataSchema:
      type: object
      description: Normalized template metadata schema (frontmatter `metadataSchema`).
      properties:
        additionalKeys:
          type: string
          enum: [allow, reject]
        fields:
          type: array
          items:
            type: object
            required: [key, type, label, required]
            properties:
              key: { type: string }
              type:
                type: string
                enum: [string, text, number, boolean, date, select, multiselect, list, url]
              label: { type: string }
              description: { type: string }
              required: { type: boolean }
              default: {}
              options:
                type: array
                items: { type: string }
              min: { type: number }
              max: { type: number }

    PageJsonResult:
      type: object
      properties:
        path: { type: string }
        title: { type: string }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        frontmatter:
          type: object
          additionalProperties: true
        content:
          type: string
          description: The page's Markdown body (no leading frontmatter block).

    PersonalPagesResult:
      type: object
      properties:
        space: { type: string, const: personal }
        spaceId: { type: string }
        spaceName: { type: string }
        spaceDescription: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/PageListItem" }

    SpacePagesResult:
      type: object
      properties:
        space: { type: string }
        spaceId: { type: string }
        spaceName: { type: string }
        spaceDescription: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/PageListItem" }

    PageVersionsResult:
      type: object
      properties:
        path: { type: string }
        currentVersion: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              title: { type: string }
              author: { type: string }
              authorType: { type: string }
              authorLabel: { type: string }
              note:
                type: [string, "null"]
                description: Change note recorded when the revision was written.
              createdAt: { type: string, format: date-time }
              isLatest: { type: boolean }

    MakeLatestResult:
      type: object
      properties:
        path: { type: string }
        sourceVersion: { type: integer }
        version: { type: integer }

    MetadataPatchRequest:
      type: object
      minProperties: 1
      properties:
        set:
          type: object
          additionalProperties: true
          description: Keys to upsert. A JSON null value deletes the key; other keys are untouched.
        append:
          type: object
          additionalProperties: true
          description: Keys whose array values grow atomically — scalars pushed, arrays concatenated; missing keys start as [].
        appendUnique:
          type: object
          additionalProperties: true
          description: Like append, but elements already present are skipped; all-duplicate patches are no-ops.

    PageMetadataResult:
      type: object
      properties:
        path: { type: string }
        metadata:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: {}
              updatedBy: { type: string }
              updatedByType: { type: string }
              updatedByLabel: { type: string }
              updatedAt: { type: string, format: date-time }

    PageMetadataHistoryResult:
      type: object
      properties:
        path: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              op: { type: string }
              value: {}
              previousValue: {}
              actor: { type: string }
              actorType: { type: string }
              actorLabel: { type: string }
              createdAt: { type: string, format: date-time }

    PageLinksResult:
      type: object
      properties:
        path: { type: string }
        outbound:
          type: array
          items:
            type: object
            properties:
              targetPath: { type: string }
              anchorText: { type: string }
              targetExists: { type: boolean }
              targetTitle: { type: [string, "null"] }
        backlinks:
          type: array
          items:
            type: object
            properties:
              sourcePath: { type: string }
              sourceTitle: { type: string }
              anchorText: { type: string }
              sourceUpdatedAt: { type: string, format: date-time }

    SpaceExportBundle:
      type: object
      required: [format, formatVersion, pages]
      properties:
        format: { type: string, const: coco-space-export }
        formatVersion: { type: integer, const: 1 }
        exportedAt: { type: string, format: date-time }
        space:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            description: { type: [string, "null"] }
        pages:
          type: array
          maxItems: 500
          items:
            type: object
            required: [path, content]
            properties:
              path:
                type: string
                description: Space-relative page path.
              title: { type: string }
              frontmatter:
                type: object
                additionalProperties: true
              content: { type: string }
              version: { type: integer }
              updatedAt: { type: string, format: date-time }
              metadata:
                type: object
                additionalProperties: true

    SpaceTemplatePageRole:
      type: string
      enum: [overview, template, agent, example, page]
      description: Coarse role of a bundle page, derived from its path conventions — `overview` orientation pages, authored `templates/*` pages, `agents/*` tasks, `example-*` illustrations, and plain context pages.

    SpaceTemplatePageSummary:
      type: object
      properties:
        path:
          type: string
          description: Bundle-relative page path (no space slug prefix).
        title: { type: string }
        description: { type: string }
        role: { $ref: "#/components/schemas/SpaceTemplatePageRole" }

    SpaceTemplateSummary:
      type: object
      properties:
        source: { type: string, enum: [builtin, remote, org] }
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        kind:
          type: string
          enum: [space, workflow, personal]
          description: Gallery grouping — `workflow` kits are complete working solutions, `space` kits are foundation page sets, `personal` bundles are page-template packs for the personal context (they feed the personal new-page picker instead of space creation). Org snapshots always report `workflow`.
        solution:
          type: [string, "null"]
          description: Marketing solution slug this template backs (coconut.dev/solutions/<solution>), when any.
        publisher:
          type: [string, "null"]
          description: Credited author/maintainer for vetted partner or community templates; null for the deployment's own catalog.
        space:
          type: object
          description: The bundle's space identity — the default name/description for spaces created from it.
          properties:
            slug: { type: string }
            name: { type: string }
            description: { type: [string, "null"] }
        pageCount: { type: integer }
        updatedAt:
          type: string
          format: date-time
          description: Present on org templates only.
        pages:
          type: array
          description: Present with `includePages=1` — a card-weight page index, no content.
          items: { $ref: "#/components/schemas/SpaceTemplatePageSummary" }

    SpaceTemplateDetail:
      type: object
      description: A template's summary plus every bundle page in full — the preview surface's data.
      properties:
        source: { type: string, enum: [builtin, remote, org] }
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        kind: { type: string, enum: [space, workflow, personal] }
        solution: { type: [string, "null"] }
        publisher: { type: [string, "null"] }
        space:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            description: { type: [string, "null"] }
        pageCount: { type: integer }
        pages:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: Bundle-relative page path.
              title: { type: string }
              description: { type: string }
              role: { $ref: "#/components/schemas/SpaceTemplatePageRole" }
              content: { type: string }
              metadata:
                type: [object, "null"]
                additionalProperties: true
                description: Metadata the page is seeded with.
              agentTask:
                type: boolean
                description: 'Present (true) on agents/* pages tagged `kind: agent-task`.'
              schema:
                $ref: "#/components/schemas/TemplateMetadataSchema"
                description: Present on authored templates/* pages that declare a metadata schema — the bundle's record types.

    SpaceTemplateDerivedPage:
      type: object
      description: One catalog bundle page projected as a single-page starting point.
      properties:
        source: { type: string, enum: [builtin, remote, org] }
        templateId: { type: string }
        templateTitle: { type: string }
        templateKind:
          type: string
          enum: [space, workflow, personal]
          description: The parent bundle's kind — `personal` entries feed the personal new-page picker, everything else the shared pickers.
        spaceName: { type: string }
        path:
          type: string
          description: Bundle-relative page path, e.g. `templates/account-brief` or `adrs`.
        title: { type: string }
        description: { type: string }
        content: { type: string }
        role:
          type: string
          enum: [template, page]
          description: '`template` for authored templates/* pages, `page` for context pages liftable into an existing space.'
        metadataDefaults:
          type: [object, "null"]
          additionalProperties: true
          description: Starting metadata for an instantiated copy — schema field defaults (merged with any metadataDefaults block) for authored templates, the shipped metadata for context pages.
        schema:
          $ref: "#/components/schemas/TemplateMetadataSchema"
          description: Present on authored templates that declare one — the catalog's installable record types.
        schemaIssues:
          type: array
          items: { type: string }
          description: Lenient-parse diagnostics for the template author; never a hard failure.
        defaultPathPrefix:
          type: string
          description: Where records of this type conventionally live (frontmatter `defaultPathPrefix`).
        frontmatter:
          type: object
          additionalProperties: true
          description: Raw frontmatter, present on authored templates so an install reproduces the template faithfully.

    SpaceTemplateDerivedAgentTask:
      type: object
      description: 'One catalog agent task: a bundle page under agents/ tagged `kind: agent-task`.'
      properties:
        source: { type: string, enum: [builtin, remote, org] }
        templateId: { type: string }
        templateTitle: { type: string }
        templateKind: { type: string, enum: [space, workflow, personal] }
        spaceName: { type: string }
        path: { type: string }
        title: { type: string }
        description: { type: string }
        content: { type: string }

    OrgSpaceTemplateSaveRequest:
      type: object
      required: [sourceSpace]
      properties:
        sourceSpace:
          type: string
          description: Slug of the space to snapshot.
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 64
          description: Template id. Defaults to the source space's slug; saving with an existing id replaces that template.
        title:
          type: string
          maxLength: 160
          description: Defaults to the space name.
        description:
          type: string
          maxLength: 500
          description: Defaults to the space description.
        category:
          type: string
          maxLength: 60

    OrgSpaceTemplateSaveResult:
      type: object
      properties:
        source: { type: string, const: org }
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        pageCount: { type: integer }

    SpaceFromTemplateRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Slug for the new space. Reserved slugs are rejected.
        name:
          type: string
          description: Defaults to the bundle's space name.
        description:
          type: string
          maxLength: 500
          description: Defaults to the bundle's space description.
        visibility:
          type: string
          enum: [private, org]
          default: private

    SpaceFromTemplateResult:
      type: object
      properties:
        space:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            description: { type: string }
            visibility: { type: string, enum: [private, org] }
        template:
          type: object
          properties:
            source: { type: string, enum: [builtin, remote, org] }
            id: { type: string }
        pages:
          type: object
          description: Per-page seeding summary.
          properties:
            created: { type: integer }
            errors:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  error: { type: string }

    WebhookEventType:
      type: string
      enum: [page.created, page.updated, page.deleted, page.metadata.updated]

    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        description: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        spaceSlug: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SearchResult:
      type: object
      properties:
        query: { type: string }
        space: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              title: { type: string }
              snippet: { type: string }
              version: { type: integer }
              score: { type: number }
              updatedAt: { type: string, format: date-time }

    MetadataQueryResult:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              op:
                type: string
                enum: [eq, neq, exists, missing, gt, gte, lt, lte, contains, in, not-in]
              value: {}
        space: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              title: { type: string }
              version: { type: integer }
              updatedAt: { type: string, format: date-time }
              metadata:
                type: object
                additionalProperties: true

    MetadataKeysResult:
      type: object
      properties:
        space: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              pageCount: { type: integer }
              valueTypes:
                type: array
                items: { type: string }
              lastUpdatedAt: { type: string, format: date-time }

    MetadataValuesResult:
      type: object
      properties:
        space: { type: [string, "null"] }
        key: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              space:
                type: string
                description: Space slug the grouped pages live in (`personal` for the caller's own personal space).
              value:
                description: The exact JSON value (jsonb equality defines distinctness).
              pageCount: { type: integer }
              lastUpdatedAt: { type: string, format: date-time }

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: "null" }
        method:
          type: string
          description: initialize, tools/list, tools/call, ping, or notifications/initialized.
        params:
          type: object
          additionalProperties: true

    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: "null" }
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
              description: Standard JSON-RPC codes plus -32001 unauthorized, -32003 access denied, -32004 not found, -32009 version conflict, -32010 page exists, -32011 space exists, -32029 rate limited, -32030 plan limit reached.
            message: { type: string }
            data: {}

    McpManifest:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        protocolVersion: { type: string }
        status: { type: string }
        endpoint: { type: string }
        setupUrl: { type: string }
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              title: { type: string }
              description: { type: string }
              annotations: { type: object, additionalProperties: true }
              requiredScopes:
                type: array
                items: { type: string }
              inputSchema: { type: object, additionalProperties: true }

    Organization:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Member:
      type: object
      properties:
        membershipId: { type: string }
        orgId: { type: string }
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer, member] }
        status: { type: string, enum: [pending, active, suspended, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MemberList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    Space:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        visibility: { type: string, enum: [private, org] }
        scopeKind: { type: string }
        isSystemManaged: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SpaceMember:
      type: object
      properties:
        spaceMembershipId: { type: string }
        spaceId: { type: string }
        orgId: { type: string }
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SpaceAgent:
      type: object
      properties:
        spaceAgentMembershipId: { type: string }
        spaceId: { type: string }
        orgId: { type: string }
        agentKeyId: { type: string }
        agentKeyName: { type: string }
        agentKeyKind: { type: string }
        agentKeySpaceId: { type: [string, "null"] }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentKey:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, revoked] }
        kind: { type: string }
        spaceId: { type: [string, "null"] }
        spaceSlug: { type: [string, "null"] }
        lastUsedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentModelSettings:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        models:
          type: array
          description: Model ids enabled for per-task selection (default model first).
          items: { type: string }
        baseUrl: { type: [string, "null"] }
        hasApiKey: { type: boolean }
        apiKeyLast4: { type: [string, "null"] }
        source: { type: string, enum: [database, default] }
        encryptionConfigured: { type: boolean }
        catalog: { type: object, additionalProperties: true }
        updatedAt: { type: [string, "null"], format: date-time }

    ConnectorCredential:
      type: object
      properties:
        id: { type: string }
        connectorKey: { type: string }
        scope: { type: string, enum: [space, org] }
        spaceSlug: { type: [string, "null"] }
        identityKind: { type: string }
        hasSecrets: { type: boolean }
        secretHints:
          type: object
          additionalProperties: { type: [string, "null"] }
        config:
          type: object
          additionalProperties: { type: [string, "null"] }
        status: { type: string }
        lastTestedAt: { type: [string, "null"], format: date-time }
        lastTestStatus: { type: [string, "null"] }
        createdBy: { type: string }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConnectorCatalogItem:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string }
        summary: { type: string }
        setupHint: { type: string }
        custom: { type: boolean }
        experimental: { type: boolean }
        credentialKind: { type: string }
        identityKind: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              secret: { type: boolean }
              required: { type: boolean }
              placeholder: { type: [string, "null"] }
              hint: { type: [string, "null"] }
              configValue: { type: [string, "null"] }
        configured: { type: boolean }
        source: { type: [string, "null"] }
        credentialId: { type: [string, "null"] }
        scope: { type: [string, "null"] }
        lastTestedAt: { type: [string, "null"], format: date-time }
        lastTestStatus: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }

    AgentSummaryItem:
      type: object
      properties:
        spaceSlug: { type: string }
        hasInstructions: { type: boolean }
        instructionsPath: { type: string }
        instructionsUpdatedAt: { type: [string, "null"], format: date-time }
        taskCount: { type: integer }
        runCount: { type: integer }
        lastRunAt: { type: [string, "null"], format: date-time }
        lastRunPath: { type: [string, "null"] }

    AgentTaskSchedule:
      type: object
      description: Parsed schedule frontmatter; null when the task has no schedule.
      properties:
        cron: { type: string }
        timezone: { type: string }
        enabled: { type: boolean }
        valid: { type: boolean }

    AgentRunStatus:
      type: string
      enum: [completed, failed, running, waiting, unknown]
      description: Presented status — running/waiting records stale for over 10 minutes read as failed.

    AgentTaskListItem:
      type: object
      properties:
        path: { type: string }
        spaceSlug: { type: string }
        task:
          type: string
          description: The task's path under `agents/`.
        title: { type: string }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        schedule:
          oneOf:
            - $ref: "#/components/schemas/AgentTaskSchedule"
            - type: "null"
        runCount: { type: integer }
        lastRunAt: { type: [string, "null"], format: date-time }
        lastRunStatus:
          oneOf:
            - $ref: "#/components/schemas/AgentRunStatus"
            - type: "null"

    AgentTaskDetail:
      allOf:
        - $ref: "#/components/schemas/AgentTaskListItem"
        - type: object
          properties:
            markdown:
              type: string
              description: Full task page as Markdown (frontmatter block + instructions body).
            frontmatter:
              type: object
              additionalProperties: true
            runs:
              type: array
              description: The task's most recent runs, newest first.
              items: { $ref: "#/components/schemas/AgentRunItem" }

    AgentRunUsage:
      type: object
      properties:
        inputTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        cacheReadTokens: { type: [integer, "null"] }
        cacheWriteTokens: { type: [integer, "null"] }
        steps: { type: [integer, "null"] }

    AgentRunItem:
      type: object
      properties:
        runId: { type: string }
        path: { type: string }
        taskPath: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        rawStatus:
          type: string
          description: The stored status, unmodified.
        trigger:
          type: string
          description: What started the run — `manual`, `schedule`, `mcp`, or `rest`.
        ranAt: { type: [string, "null"], format: date-time }
        durationMs: { type: [number, "null"] }
        modelProvider: { type: [string, "null"] }
        modelId: { type: [string, "null"] }
        usage:
          oneOf:
            - $ref: "#/components/schemas/AgentRunUsage"
            - type: "null"
        turns: { type: [integer, "null"] }
        sessionId: { type: [string, "null"] }
        summary: { type: string }
        updatedAt: { type: string, format: date-time }

    AgentRunDetail:
      allOf:
        - $ref: "#/components/schemas/AgentRunItem"
        - type: object
          properties:
            sourceTitle: { type: [string, "null"] }
            markdown:
              type: string
              description: The run's visible Markdown output (transcript block stripped).
            transcript:
              type: array
              description: Chronological agent activity entries; present only with `includeTranscript=true`.
              items:
                type: object
                additionalProperties: true

    AgentRunQueued:
      type: object
      required: [runId, status]
      properties:
        runId: { type: string }
        status: { type: string, const: queued }
        runPath:
          type: string
          description: The write-ahead run record's page path (`<space>/agents/runs/<task>/<runId>`).
        taskPath: { type: string }

    AgentInstructionsResult:
      type: object
      properties:
        path: { type: string }
        exists: { type: boolean }
        markdown: { type: [string, "null"] }
        version: { type: [integer, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }

    AgentTaskWriteRequest:
      type: object
      required: [content]
      properties:
        title: { type: string }
        frontmatter:
          type: object
          additionalProperties: true
          description: Optional frontmatter (e.g. `schedule` — 5-field cron — plus `scheduleTz`, `scheduleEnabled`).
        content:
          type: string
          description: Markdown task instructions the agent executes on each run, stored verbatim on this REST surface. Pass scheduling via the `frontmatter` field — only the MCP door's `agent_*` tools fold a leading `---` block into title/frontmatter.

    AgentInstructionsWriteRequest:
      type: object
      required: [content]
      properties:
        title: { type: string }
        content:
          type: string
          description: Markdown persona content, stored verbatim on this REST surface. Only the MCP door's `agent_set_instructions` folds a leading `---` block out rather than storing it.

    IdentityProvider:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        providerKey: { type: string }
        issuer: { type: string }
        profile: { type: string, enum: [google, okta, microsoft] }
        scimEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScimToken:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        providerKey: { type: string }
        status: { type: string }
        lastUsedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IdentityMapping:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        providerKey: { type: string }
        groupKey: { type: string }
        targetKind: { type: string, enum: [org_member, space_member] }
        targetRole: { type: string, enum: [member, viewer, editor] }
        spaceId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        actorId: { type: string }
        actorKind: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        before: {}
        after: {}
        createdAt: { type: string, format: date-time }

    ScimUserRequest:
      type: object
      required: [externalId, email]
      properties:
        externalId: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, description: Defaults to the email. }
        active: { type: boolean, default: true }
        groups:
          type: array
          items: { type: string }

    ScimUserResult:
      type: object
      properties:
        ok: { type: boolean }
        providerKey: { type: string }
        externalId: { type: string }
        membershipId: { type: string }
        userId: { type: string }
        status: { type: string }
        appliedMappings: {}
