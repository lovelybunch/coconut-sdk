  /admin/agent-settings:
    get:
      tags: [Admin]
      operationId: getAdminAgentSettings
      summary: Agent model settings
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Provider/model configuration (API key exposed only as last-4 hint).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentModelSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [Admin]
      operationId: putAdminAgentSettings
      summary: Update agent model settings
      description: The API key is encrypted at rest; pass `clearApiKey` to remove it (mutually exclusive with `apiKey`).
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string, maxLength: 200 }
                models:
                  type: array
                  description: Model ids enabled for per-task selection; the default model is always included. Omit to keep the stored list.
                  maxItems: 25
                  items: { type: string, maxLength: 200 }
                baseUrl: { type: [string, "null"], format: uri }
                apiKey: { type: string }
                clearApiKey: { type: boolean }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentModelSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/connector-credentials:
    get:
      tags: [Admin]
      operationId: listAdminConnectorCredentials
      summary: List stored connector credentials
      description: Secrets are write-only; listings expose last-4 hints only.
      parameters:
        - { name: connectorKey, in: query, schema: { type: string } }
        - { name: spaceSlug, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [org] }, description: Restrict to org-level records. }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked] } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Credential records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorCredential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [Admin]
      operationId: upsertAdminConnectorCredential
      summary: Store or update connector credentials
      description: Secret fields are encrypted at rest (requires `COCO_SETTINGS_ENCRYPTION_KEY`); a JSON null clears a field. Omit `spaceSlug` for an org-level record; `personal` resolves to the caller's personal space and is the one scope a non-admin may write — authorized by a write check against that personal space, so a read-scoped principal is refused.
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorKey]
              properties:
                connectorKey: { type: string }
                spaceSlug: { type: [string, "null"] }
                secrets:
                  type: object
                  additionalProperties: { type: [string, "null"] }
                config:
                  type: object
                  additionalProperties: { type: [string, "null"] }
      responses:
        "200":
          description: Stored credential record (hints only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorCredential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/connector-credentials/test:
    post:
      tags: [Admin]
      operationId: testAdminConnectorCredential
      summary: Test a connector's credentials
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorKey]
              properties:
                connectorKey: { type: string }
                spaceSlug: { type: [string, "null"] }
      responses:
        "200":
          description: Test outcome (also persisted on the credential record).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, not_declared, missing_credentials, auth_failed, unreachable, timeout, not_supported]
                  message: { type: string }
                  source: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

