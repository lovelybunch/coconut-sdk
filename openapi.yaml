                    type: object
                    properties:
                      configured: { type: boolean }
                  actor: { $ref: "#/components/schemas/Actor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/organization:
    get:
      tags: [Admin]
      operationId: getAdminOrganization
      summary: Organization details
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/members:
    get:
      tags: [Admin]
      operationId: listAdminMembers
      summary: List org members
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Admin]
      operationId: upsertAdminMember
      summary: Add or update an org member (operator)
      description: |
        Invite-by-email attaches the global account behind the address. Until multi-org
        login ships, an email whose account is already active in another organization is
        refused (409 `account_already_in_organization`) unless the deployment sets
        `COCO_ALLOW_MULTI_ORG_MEMBERSHIP=1`.
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                role: { type: string, enum: [owner, admin, editor, viewer] }
      responses:
        "201":
          description: Member created or updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/members/{membershipId}:
    patch:
      tags: [Admin]
      operationId: updateAdminMemberRole
      summary: Change a member's role
      description: |
        Guarded against locking out the last active admin-capable operator (409
        `operator_lockout_risk`). Reactivating a non-active row is refused (409
        `account_already_in_organization`) while the account is active in another
        organization, unless the deployment sets `COCO_ALLOW_MULTI_ORG_MEMBERSHIP=1`.
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, editor, viewer] }
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Admin]
      operationId: removeAdminMember
      summary: Remove a member
      description: Guarded against operator lockout (409 `operator_lockout_risk`).
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: List users
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Admin]
      operationId: upsertAdminUser
      summary: Create or update a user
      description: |
        Invite-by-email attaches the global account behind the address. Until multi-org
        login ships, an email whose account is already active in another organization is
        refused (409 `account_already_in_organization`) unless the deployment sets
        `COCO_ALLOW_MULTI_ORG_MEMBERSHIP=1`.
      parameters: [{ $ref: "#/components/parameters/OrgSlugHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                status: { type: string, enum: [pending, active, suspended, rejected], default: pending }
      responses:
        "201":
          description: User created or updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/users/{membershipId}/status:
    patch:
      tags: [Admin]
      operationId: updateAdminUserStatus
      summary: Change a user's membership status
      description: |
        Setting `active` on a non-active row is refused (409
        `account_already_in_organization`) while the account is active in another
        organization, unless the deployment sets `COCO_ALLOW_MULTI_ORG_MEMBERSHIP=1`.
        Other status changes are unrestricted.
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/OrgSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, active, suspended, rejected] }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

